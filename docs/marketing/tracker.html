<title>Bell Theory Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="bt-style">
  :root{
    --bg:#eef1f4; --surface:#ffffff; --raised:#f6f8fa; --ink:#12151b; --dim:#5a6371; --faint:#8a929e;
    --line:#dce1e7; --accent:#17806d; --accent-ink:#ffffff; --coin:#a8780a; --left:#c9711c; --right:#1f7fc4;
    --good:#1c7c4a; --warn:#a8780a; --bad:#c43d3d; --chip:#e7ecf0;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans:'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0d11; --surface:#141820; --raised:#1a1f28; --ink:#eef0f4; --dim:#8b93a3; --faint:#5d6574;
      --line:rgba(255,255,255,.09); --accent:#7dd3c0; --accent-ink:#0a0d11; --coin:#f2c14e; --left:#ffb454; --right:#5ec8ff;
      --good:#6fd39a; --warn:#f2c14e; --bad:#ff7a7a; --chip:#222834; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0d11; --surface:#141820; --raised:#1a1f28; --ink:#eef0f4; --dim:#8b93a3; --faint:#5d6574;
    --line:rgba(255,255,255,.09); --accent:#7dd3c0; --accent-ink:#0a0d11; --coin:#f2c14e; --left:#ffb454; --right:#5ec8ff;
    --good:#6fd39a; --warn:#f2c14e; --bad:#ff7a7a; --chip:#222834; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.55; margin:0}
  .wrap{max-width:980px; margin:0 auto; padding-inline:16px; padding-block:20px 60px}
  h1,h2,h3{text-wrap:balance; margin:0}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* Masthead: the two orbs and the seam are the game's own mark. */
  .mast{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px}
  .brand{display:flex; align-items:center; gap:14px}
  .orbs{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.16em; color:var(--faint)}
  .orb{width:16px; height:16px; border-radius:50%}
  .orb.l{background:var(--left); box-shadow:0 0 12px var(--left)}
  .orb.r{background:var(--right); box-shadow:0 0 12px var(--right)}
  .brand h1{font-family:var(--mono); font-weight:500; font-size:18px; letter-spacing:.28em; text-transform:uppercase}
  .brand p{margin:2px 0 0; color:var(--dim); font-size:12.5px}
  .status{display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:220px}
  .pill{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; padding:4px 10px; border-radius:99px; border:1px solid var(--line); background:var(--surface)}
  .pill.draft{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 45%, transparent)}
  .pill.final{color:var(--good); border-color:color-mix(in srgb, var(--good) 45%, transparent)}
  .meter{width:220px; max-width:100%; height:6px; border-radius:3px; background:var(--chip); overflow:hidden}
  .meter i{display:block; height:100%; background:var(--accent); transition:width .3s}
  .status small{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}

  .tabs{display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:18px}
  .tabs button{background:none; border:none; padding:10px 12px; color:var(--dim); font-size:13px; border-bottom:2px solid transparent; white-space:nowrap; min-height:44px}
  .tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
  .tabs .count{font-family:var(--mono); font-size:11px; color:var(--faint); margin-left:4px}

  .panel{display:flex; flex-direction:column; gap:12px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
  .row{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
  .spread{justify-content:space-between}
  .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
  .sec h3{font-size:15px}
  .sec .body{white-space:pre-wrap; color:var(--dim); margin-top:8px; font-size:13.5px; max-width:72ch}
  .sec.locked{border-color:color-mix(in srgb, var(--good) 40%, var(--line))}
  textarea{width:100%; min-height:140px; resize:vertical; background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:13px; line-height:1.5}
  input,select{background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:0 10px; min-height:40px; min-width:0}
  .btn{background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:0 12px; min-height:36px; font-size:12.5px}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
  .btn.ghost{background:none}
  .chip{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:99px; background:var(--chip); color:var(--dim)}
  .chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)} .chip.accent{color:var(--accent)}
  .muted{color:var(--dim)} .small{font-size:12px}

  .dec .q{font-weight:600}
  .dec .rec{font-size:12.5px; color:var(--dim)}
  .dec .rec b{color:var(--accent); font-weight:600}

  .board{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px}
  @media (max-width:820px){ .board{grid-template-columns:repeat(2, minmax(0,1fr))} }
  @media (max-width:480px){ .board{grid-template-columns:minmax(0,1fr)} }
  .col{display:flex; flex-direction:column; gap:8px; align-content:start}
  .col h3{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:500; padding:4px 2px}
  .task{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px}
  .task.done .t{text-decoration:line-through; color:var(--faint)}
  .task .t{font-size:13px}

  .tablewrap{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px}
  table{border-collapse:collapse; width:100%; font-size:12.5px}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:500}
  td.num{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
  td.good{color:var(--good)} td.bad{color:var(--bad)}
  form.add{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; align-items:end}
  form.add label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--dim)}
  .vs{display:flex; align-items:center; gap:10px; font-weight:600}
  .vs .dot{width:10px; height:10px; border-radius:50%}
  .vs .l{background:var(--left)} .vs .r{background:var(--right)}
  .vs em{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.14em}
  .banned .vs span{text-decoration:line-through; color:var(--faint)}

  .jq{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; align-items:start}
  .jq .ans{font-family:var(--mono); font-size:13px; text-align:right; font-variant-numeric:tabular-nums}
  .bar{grid-column:1 / -1; height:4px; border-radius:2px; background:var(--chip); overflow:hidden}
  .bar i{display:block; height:100%; background:var(--accent)}
  .note{font-size:12.5px; color:var(--dim); max-width:72ch}
  .banner{border:1px dashed var(--line); border-radius:10px; padding:12px 14px; color:var(--dim); font-size:13px}
  .foot{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-top:24px; padding-top:14px; border-top:1px solid var(--line)}
  .foot textarea{flex-basis:100%; min-height:120px; font-family:var(--mono); font-size:11.5px}
  html{height:auto} body{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion: reduce){ .meter i{transition:none} }
</style>
<script type="application/json" id="bt-state">{"rev":1,"sections":[{"id":"idea","order":1,"title":"The idea: country vs country","body":"The two orbs already take any colour or image. Dress one as a flag and the other as a rival flag, and every run becomes a match: whichever side hits a wall first loses.\n\n• Left lane Brazil, right lane Argentina. Caption on frame one: \"Brazil vs Argentina. Who hits the wall first?\"\n• 8–15 seconds of real play. The crash is the punchline.\n• End card: \"Argentina wins. Comment the next matchup.\"\n• The comments pick the next video. The audience writes the calendar, and national pride makes people comment.","status":"draft"},{"id":"jev","order":8,"title":"Jev check","body":"The payload lives in docs/marketing: jev-state.json goes in the State box, jev-questions.json in the Questions box, and jev-request.json is the full API request. Twelve questions: hook clarity, comment loop, ad-to-app match, Versus before paid, two-player hook, policy risk, first channel, ad length, first market, video style, fit with the game, and whether day-1 retention clears 35%. Paste the answer in the Jev tab. Choice and score answers under 0.5 confidence count as inconclusive.","status":"draft"},{"id":"metrics","order":7,"title":"What we measure","body":"• Organic: average watch time, comments per 1,000 views, follows. Targets set after the first 10 posts; there is no reliable benchmark for this format.\n• Paid: click-through rate, installs per 1,000 impressions, cost per install. Target CPI under $0.40 (publisher bar, US Android).\n• Product: day-1 retention 35% or more (publisher bar); day-7 about 10% or more.","status":"draft"},{"id":"phases","order":6,"title":"Phases","body":"0. Build: Versus mode, flag pack, clip capture, analytics, Android build. Cost: $25 Play account. Done when a matchup clip can be produced from the real app.\n1. Organic: one matchup a day on TikTok, Reels and Shorts for 3–4 weeks. Cost: $0. Done at 20+ posts with the top 3 by watch time and comments known.\n2. Paid test: soft launch in 1–2 countries, run the top organic clips as ads. Cost: $200–500. Done at 500+ installs with CPI, CTR and day-1 retention measured.\n3. Decide: pitch publishers, keep and scale, or fix the first session and retest. Done when the decision is logged.","status":"draft"},{"id":"product","order":5,"title":"Product work the plan needs","body":"Bookmarked, not built:\n• Versus mode: pick two flags; the side that crashes loses; a result card names the winner.\n• Two players, one phone: each person takes one lane. The two-thumb mode already reads two separate touches.\n• Flag pack: about 50 flags to start, the biggest markets plus the big sports rivals.\n• Clip capture: a script that plays a matchup and records a vertical clip.\n• Analytics: needed to measure day-1 retention at all. Rewrite the privacy docs together with the ads change.","status":"draft"},{"id":"rules","order":3,"title":"Rules and risks","body":"• The ad must match the app. TikTok bans ads that mislead about the product, so Versus mode (flag skins and a winner card) ships before any paid ad runs.\n• Sports rivalries yes, conflicts no. Never pair countries in an active war or territorial dispute. Meta rejects ads that exploit crises or controversial events.\n• Use a permissively licensed SVG flag set, not emoji flags (they render differently on every phone and not at all on Windows).\n• Script-driven runs are real engine footage. Never edit a result the game did not produce.","status":"draft"},{"id":"spec","order":4,"title":"Ad spec","body":"• 9:16 vertical, 1080×1920, captions burned in, readable muted.\n• Hook in the first second: both flags and \"vs\" on screen before anything moves.\n• 8–15 s for prospecting. Test one 6–8 s cut and one 15–20 s cut against it.\n• Variants per matchup: clean-thread finish, boost-wreck finish, near miss, purple-coin moment.\n• End card, 1.5 s: winner, game name, \"comment the next matchup\".","status":"draft"},{"id":"why","order":2,"title":"Why it fits","body":"• It is the game's real mechanic: two lanes, two orbs, one crash decides it. Nothing is faked.\n• Two flags and \"vs\" read in one second with the sound off. Short-form ads live or die in the first 1–3 seconds.\n• \"Comment your country\" gives viewers a reason to comment, and comments push organic reach.\n• It is cheap: a script can play the game and record it, so one matchup is minutes of work.","status":"draft"}],"decisions":[{"id":"ads_personal","order":9,"question":"Personalized or non-personalized ads?","options":["Non-personalized","Personalized"],"recommendation":"Non-personalized","why":"no tracking popup on first launch","answer":"","status":"open"},{"id":"analytics","order":8,"question":"Analytics tool?","options":["GameAnalytics","Firebase"],"recommendation":"GameAnalytics","why":"publishers already read it","answer":"","status":"open"},{"id":"budget","order":7,"question":"Paid test budget cap?","options":["$200","$300","$500"],"recommendation":"$300","why":"","answer":"","status":"open"},{"id":"first_matchups","order":5,"question":"First 10 matchups agreed, plus the banned list?","options":["Agreed","Needs changes"],"recommendation":"","why":"","answer":"","status":"open"},{"id":"market","order":4,"question":"First soft-launch country?","options":["Canada","Australia","Philippines","Canada + Philippines"],"recommendation":"Philippines","why":"cheapest installs, standard for ad-funded games","answer":"","status":"open"},{"id":"mode_name","order":3,"question":"What is the mode called?","options":["Versus","Flag Duel","Country Clash","Other"],"recommendation":"","why":"","answer":"","status":"open"},{"id":"two_player","order":2,"question":"Two players on one phone: at launch or after?","options":["At launch","After launch"],"recommendation":"At launch","why":"it makes \"who hits the wall\" literally true","answer":"","status":"open"},{"id":"versus_real","order":1,"question":"Versus: a real in-game mode, or flag skins only?","options":["Real Versus mode","Flag skins only"],"recommendation":"Real Versus mode","why":"the ad has to match the app","answer":"","status":"open"},{"id":"voice","order":6,"question":"Who posts, and in what style?","options":["Pure gameplay + captions","Gameplay + my voice","Me on camera reacting"],"recommendation":"Gameplay + my voice","why":"creator-style ads wear out slower than studio ads","answer":"","status":"open"}],"tasks":[{"id":"t01","order":1,"phase":"build","title":"Answer the open decisions","owner":"you","status":"todo"},{"id":"t02","order":2,"phase":"build","title":"Open the Google Play developer account ($25)","owner":"you","status":"todo"},{"id":"t03","order":3,"phase":"build","title":"Versus mode: flag picker, loser = side that crashes, winner card","owner":"claude","status":"todo"},{"id":"t04","order":4,"phase":"build","title":"Two players, one phone","owner":"claude","status":"todo"},{"id":"t05","order":5,"phase":"build","title":"Flag pack (SVG, permissive licence)","owner":"claude","status":"todo"},{"id":"t06","order":6,"phase":"build","title":"Clip capture script: play a matchup, record 9:16 video","owner":"claude","status":"todo"},{"id":"t07","order":7,"phase":"build","title":"Analytics hookup + privacy doc rewrite","owner":"claude","status":"todo"},{"id":"t08","order":8,"phase":"build","title":"Android cloud build + store listing","owner":"claude","status":"todo"},{"id":"t09","order":9,"phase":"organic","title":"Create TikTok, Instagram and YouTube accounts","owner":"you","status":"todo"},{"id":"t10","order":10,"phase":"organic","title":"Post one matchup a day for 3–4 weeks","owner":"you","status":"todo"},{"id":"t11","order":11,"phase":"organic","title":"Log views and comments per matchup here","owner":"you","status":"todo"},{"id":"t12","order":12,"phase":"paid","title":"Soft launch in the chosen country","owner":"you","status":"todo"},{"id":"t13","order":13,"phase":"paid","title":"Run the top 3 organic clips as paid ads","owner":"you","status":"todo"},{"id":"t14","order":14,"phase":"paid","title":"Log spend, installs and day-1 retention in Test results","owner":"you","status":"todo"},{"id":"t15","order":15,"phase":"decide","title":"Compare results with the targets","owner":"claude","status":"todo"},{"id":"t16","order":16,"phase":"decide","title":"Decide: pitch, scale, or fix and retest","owner":"you","status":"todo"}],"tests":[],"matchups":[{"id":"m01","order":1,"left":"Brazil","right":"Argentina","note":"The classic football rivalry","status":"idea","views":null,"comments":null},{"id":"m02","order":2,"left":"USA","right":"Mexico","note":"Biggest rivalry in North American football","status":"idea","views":null,"comments":null},{"id":"m03","order":3,"left":"England","right":"Germany","note":"Decades of tournament history","status":"idea","views":null,"comments":null},{"id":"m04","order":4,"left":"Spain","right":"Portugal","note":"Neighbour rivalry","status":"idea","views":null,"comments":null},{"id":"m05","order":5,"left":"France","right":"Italy","note":"World Cup final history","status":"idea","views":null,"comments":null},{"id":"m06","order":6,"left":"Australia","right":"New Zealand","note":"Rugby and cricket rivalry","status":"idea","views":null,"comments":null},{"id":"m07","order":7,"left":"Canada","right":"USA","note":"Hockey rivalry","status":"idea","views":null,"comments":null},{"id":"m08","order":8,"left":"Japan","right":"South Korea","note":"Football rivalry; keep it about sport","status":"idea","views":null,"comments":null}],"jev":[],"jevq":{"questions":{"hook_reads_in_one_second":{"type":"noul","instructions":"A muted viewer scrolling past understands the `marketing_idea.hook` (two flags and 'vs') as a competition within the first second of the video."},"comments_drive_the_loop":{"type":"noul","instructions":"Asking viewers to 'comment the next matchup' in `marketing_idea.concept` produces enough comments per video to keep choosing the next matchup from them."},"ad_matches_app_today":{"type":"noul","instructions":"The country-vs-country video in `marketing_idea` accurately represents what a player can do in the app as described in `product_gap`.","criteria":{"true":"A player who installs from the ad can play a flag-vs-flag match and see a winner named, as the ad shows.","false":"The ad shows flags or a named winner that the app does not offer."}},"versus_before_paid":{"type":"noul","instructions":"Versus mode with flag skins and a winner card should ship in the app before any paid ad from `marketing_idea` runs."},"two_player_one_phone_is_the_hook":{"type":"noul","instructions":"Letting two people share one phone, one lane each, makes the country-vs-country framing stronger than one person playing both flags."},"policy_risk":{"type":"score","instructions":"How likely ads built on `marketing_idea`, following `marketing_idea.matchup_rule`, are to be rejected by Meta or TikTok ad review.","criteria":["Approved like any ordinary game ad","Occasional rejections on specific matchups, fixed by swapping the pair","Frequent rejections that force a change of concept"]},"best_first_channel":{"type":"choice","instructions":"Which channel the founder in `constraints` should start `marketing_idea` on.","criteria":{"tiktok_organic":"Free posts on a TikTok account","reels_organic":"Free posts on Instagram Reels","shorts_organic":"Free posts on YouTube Shorts","all_three_organic":"The same clip posted to all three free channels","paid_meta":"Paid ads on Facebook and Instagram from day one","paid_tiktok":"Paid ads on TikTok from day one","other":"Something not listed"}},"best_ad_length":{"type":"choice","instructions":"Which video length gives `marketing_idea` the best install rate for a first paid test.","criteria":{"six_to_eight":"6-8 seconds: one short run and the crash","eight_to_fifteen":"8-15 seconds: a run with a boost or near miss, then the crash","fifteen_to_thirty":"15-30 seconds: a longer match with several moments","other":"Something not listed"}},"first_soft_launch_market":{"type":"choice","instructions":"Which market to soft-launch in first, given `game.monetization_plan` and `constraints`.","criteria":{"canada":"Canada: behaves like the US, higher install costs","australia":"Australia: standard soft-launch market, behaves like the US","philippines":"Philippines: cheap installs, common for ad-funded games","canada_and_philippines":"One of each to compare","other":"Something not listed"}},"creative_style":{"type":"choice","instructions":"Which video style best suits `marketing_idea` for this solo founder.","criteria":{"pure_gameplay":"Screen recording with captions only","gameplay_with_voice":"Screen recording with the founder's voice calling the match","creator_reaction":"The founder or a creator on camera reacting to the match","other":"Something not listed"}},"fit_with_game":{"type":"score","instructions":"How well `marketing_idea` shows off what is actually fun about the game in `game.core_loop`.","criteria":["Hides the core loop; the flags carry the whole video","Shows the loop, but the flags are doing most of the work","The loop and the flags reinforce each other: threading and crashing are the drama"]},"d1_bar_reachable":{"type":"noul","instructions":"Players acquired through `marketing_idea` reach the day-1 retention target in `targets.d1_retention`."}}}}</script>

d=\"saveState\" class=\"small muted\"><\/span>\n    <button type=\"button\" class=\"btn\" id=\"copyData\">Copy data<\/button>\n    <textarea id=\"rawData\" aria-label=\"Tracker data\" hidden readonly><\/textarea>\n  <\/footer>\n<\/div>";

  function $(sel, root){ return (root||document).querySelector(sel); }
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if(attrs) Object.keys(attrs).forEach(function(k){
      if(k === "text") n.textContent = attrs[k];
      else if(k === "class") n.className = attrs[k];
      else if(k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] != null) n.setAttribute(k, attrs[k]);
    });
    (kids||[]).forEach(function(c){ if(c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function notice(msg){ var n = $("#notice"); n.textContent = msg || ""; n.hidden = !msg; }
  function byOrder(a, b){ return (a.order||0) - (b.order||0) || String(a.id).localeCompare(String(b.id)); }
  function num(v){ var x = parseFloat(v); return isFinite(x) ? x : null; }
  function uid(){ return Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
  function find(col, id){ for(var i=0;i<S[col].length;i++) if(S[col][i].id === id) return S[col][i]; return null; }

  // ---------- saving ----------
  function esc(json){ return json.replace(/</g, "\\u003c"); }
  function pageSource(){
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
      + '<title>Bell Theory Marketing</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">'
      + '<style id="bt-style">' + STYLE_SRC + '</style></head><body>'
      + '<script type="application/json" id="bt-state">' + esc(JSON.stringify(S)) + '<\/script>'
      + '<script id="bt-app">' + APP_SRC + '<\/script></body></html>';
  }
  var saveTimer = null;
  function commit(){
    S.rev = (S.rev || 0) + 1;
    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
    renderAll();
    if(mode !== "publish") return;
    clearTimeout(saveTimer);
    $("#saveState").textContent = "Saving…";
    saveTimer = setTimeout(function(){
      if(Object.keys(editing).some(function(k){ return editing[k]; })){ commit(); return; }
      art.publish(pageSource()).then(function(){
        try{ localStorage.removeItem(LS_KEY); }catch(e){}
      }, function(e){
        var code = e && e.code;
        if(code === "conflict") return;          // the view reloads to the newer version on its own
        if(code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required"){
          setMode("local"); return;
        }
        $("#saveState").textContent = code === "rate_limited" ? "Saving paused, too many saves. Your change is kept here." : "Not saved yet. Your change is kept in this browser.";
      });
    }, 900);
  }
  function upd(col, id, patch){ var o = find(col, id); if(!o) return; Object.keys(patch).forEach(function(k){ o[k] = patch[k]; }); commit(); }
  function add(col, obj){ obj.id = uid(); S[col].push(obj); commit(); }
  function del(col, id){ S[col] = S[col].filter(function(o){ return o.id !== id; }); commit(); }

  function setMode(m){
    mode = m;
    var s = $("#saveState");
    if(m === "publish") s.textContent = "Changes save to this page for everyone who opens it.";
    else s.textContent = "Changes save in this browser only. Use Copy data to send them to Claude.";
  }

  // ---------- tabs ----------
  var tabKey = "plan";
  try{ tabKey = localStorage.getItem("bt-mkt-tab") || "plan"; }catch(e){}
  function showTab(k){
    tabKey = k;
    document.querySelectorAll("#tabs button").forEach(function(b){ b.setAttribute("aria-selected", String(b.dataset.tab === k)); });
    document.querySelectorAll("[data-panel]").forEach(function(p){ p.hidden = p.dataset.panel !== k; });
    try{ localStorage.setItem("bt-mkt-tab", k); }catch(e){}
  }
  document.querySelectorAll("#tabs button").forEach(function(b){ b.addEventListener("click", function(){ showTab(b.dataset.tab); }); });
  if(location.hash && $('[data-tab="' + location.hash.slice(1) + '"]')) tabKey = location.hash.slice(1);
  showTab(tabKey);

  $("#copyData").addEventListener("click", function(){
    var txt = JSON.stringify(S, null, 2), btn = $("#copyData");
    function done(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy data"; }, 1600); }
    try{
      navigator.clipboard.writeText(txt).then(done, function(){ showRaw(txt); });
    }catch(e){ showRaw(txt); }
  });
  function showRaw(txt){ var t = $("#rawData"); t.hidden = false; t.value = txt; t.focus(); t.select(); }

  // ---------- status ----------
  function renderStatus(){
    var secs = S.sections, decs = S.decisions;
    var locked = secs.filter(function(s){ return s.status === "locked"; }).length;
    var decided = decs.filter(function(d){ return d.status === "decided"; }).length;
    var total = secs.length + decs.length, done = locked + decided;
    var final = total > 0 && done === total;
    var pill = $("#planPill");
    pill.textContent = final ? "Final" : "Draft";
    pill.className = "pill " + (final ? "final" : "draft");
    $("#planMeter").style.width = (total ? Math.round(done/total*100) : 0) + "%";
    $("#planCount").textContent = locked + " of " + secs.length + " sections locked · " + decided + " of " + decs.length + " decisions made";
    $("#c-plan").textContent = locked + "/" + secs.length;
    $("#c-decisions").textContent = decided + "/" + decs.length;
    $("#c-tasks").textContent = S.tasks.filter(function(t){ return t.status === "done"; }).length + "/" + S.tasks.length;
    $("#c-tests").textContent = S.tests.length || "";
    $("#c-matchups").textContent = S.matchups.length || "";
    $("#c-jev").textContent = S.jev.length || "";
  }

  // ---------- plan ----------
  function renderPlan(){
    var p = $('[data-panel="plan"]'); p.textContent = "";
    p.appendChild(el("p", { class:"note", text:"Each section stays a draft until you lock it. The plan turns Final when every section is locked and every decision is made." }));
    S.sections.slice().sort(byOrder).forEach(function(s){
      var locked = s.status === "locked";
      var card = el("article", { class:"card sec" + (locked ? " locked" : "") });
      card.appendChild(el("div", { class:"row spread" }, [
        el("div", {}, [ el("div", { class:"eyebrow", text:"Section " + (s.order||"") }), el("h3", { text:s.title||"Untitled" }) ]),
        el("div", { class:"row" }, [
          el("span", { class:"chip " + (locked ? "good" : "warn"), text: locked ? "Locked" : "Draft" }),
          locked ? null : el("button", { class:"btn ghost", text: editing[s.id] ? "Cancel" : "Edit", onclick:function(){ editing[s.id] = !editing[s.id]; renderPlan(); } }),
          el("button", { class:"btn" + (locked ? "" : " primary"), text: locked ? "Unlock" : "Lock",
            onclick:function(){ editing[s.id] = false; upd("sections", s.id, { status: locked ? "draft" : "locked" }); } })
        ])
      ]));
      if(editing[s.id] && !locked){
        var ta = el("textarea", { id:"sec-" + s.id, "aria-label":"Edit " + (s.title||"section") }); ta.value = s.body || "";
        card.appendChild(el("div", { style:"margin-top:10px" }, [ ta ]));
        card.appendChild(el("div", { class:"row", style:"margin-top:8px" }, [
          el("button", { class:"btn primary", text:"Save", onclick:function(){ editing[s.id] = false; upd("sections", s.id, { body: ta.value }); } })
        ]));
      } else card.appendChild(el("div", { class:"body", text:s.body || "" }));
      p.appendChild(card);
    });
  }

  // ---------- decisions ----------
  function renderDecisions(){
    var p = $('[data-panel="decisions"]'); p.textContent = "";
    p.appendChild(el("p", { class:"note", text:"Pick an answer and mark it decided. The lean is the plan's current recommendation, not a choice made for you." }));
    S.decisions.slice().sort(byOrder).forEach(function(d){
      var decided = d.status === "decided";
      var sel = el("select", { id:"dec-" + d.id, "aria-label":d.question });
      sel.appendChild(el("option", { value:"", text:"Choose…" }));
      (d.options||[]).forEach(function(o){ var op = el("option", { value:o, text:o }); if(d.answer === o) op.selected = true; sel.appendChild(op); });
      sel.disabled = decided;
      sel.addEventListener("change", function(){ upd("decisions", d.id, { answer: sel.value }); });
      p.appendChild(el("article", { class:"card dec" }, [
        el("div", { class:"row spread" }, [ el("div", { class:"q", text:d.question }), el("span", { class:"chip " + (decided ? "good" : "warn"), text: decided ? "Decided" : "Open" }) ]),
        d.recommendation ? el("div", { class:"rec" }, [ "Lean: ", el("b", { text:d.recommendation }), d.why ? " · " + d.why : "" ]) : null,
        el("div", { class:"row", style:"margin-top:10px" }, [
          sel,
          el("button", { class:"btn" + (decided ? "" : " primary"), text: decided ? "Reopen" : "Mark decided",
            onclick:function(){
              if(!decided && !sel.value){ notice("Choose an answer before marking it decided."); return; }
              notice(""); upd("decisions", d.id, { status: decided ? "open" : "decided" });
            } })
        ])
      ]));
    });
  }

  // ---------- tasks ----------
  var NEXT = { todo:"doing", doing:"done", done:"todo" };
  function renderTasks(){
    var p = $('[data-panel="tasks"]'); p.textContent = "";
    var board = el("div", { class:"board" });
    PHASES.forEach(function(ph){
      var col = el("div", { class:"col" }, [ el("h3", { text:ph[1] }) ]);
      S.tasks.filter(function(t){ return t.phase === ph[0]; }).sort(byOrder).forEach(function(t){
        var st = t.status || "todo";
        col.appendChild(el("div", { class:"task" + (st === "done" ? " done" : "") }, [
          el("div", { class:"t", text:t.title }),
          el("div", { class:"row spread" }, [
            el("span", { class:"chip" + (t.owner === "claude" ? " accent" : ""), text: t.owner === "claude" ? "Claude" : "You" }),
            el("div", { class:"row" }, [
              el("button", { class:"btn", text: st === "todo" ? "To do" : (st === "doing" ? "Doing" : "Done"), "aria-label":"Status: " + st + ". Advance.",
                onclick:function(){ upd("tasks", t.id, { status: NEXT[st] }); } }),
              el("button", { class:"btn ghost", text:"Remove", onclick:function(){ del("tasks", t.id); } })
            ])
          ])
        ]));
      });
      board.appendChild(col);
    });
    p.appendChild(board);
    var f = el("form", { class:"add card" });
    var title = el("input", { id:"task-title", placeholder:"New task", required:"" });
    var phase = el("select", { id:"task-phase" }); PHASES.forEach(function(ph){ phase.appendChild(el("option", { value:ph[0], text:ph[1] })); });
    var owner = el("select", { id:"task-owner" }, [ el("option", { value:"you", text:"You" }), el("option", { value:"claude", text:"Claude" }) ]);
    f.appendChild(el("label", {}, [ "Task", title ])); f.appendChild(el("label", {}, [ "Phase", phase ])); f.appendChild(el("label", {}, [ "Owner", owner ]));
    f.appendChild(el("button", { class:"btn primary", type:"submit", text:"Add task" }));
    f.addEventListener("submit", function(e){
      e.preventDefault(); if(!title.value.trim()) return;
      add("tasks", { title:title.value.trim(), phase:phase.value, owner:owner.value, status:"todo", order:Date.now() });
    });
    p.appendChild(f);
  }

  // ---------- test results ----------
  function renderTests(){
    var p = $('[data-panel="tests"]'); p.textContent = "";
    p.appendChild(el("p", { class:"note", text:"Log each campaign or organic batch. CTR, installs per 1,000 impressions and cost per install are worked out for you. Targets: CPI under $" + TARGET.cpi.toFixed(2) + ", day-1 retention " + TARGET.d1 + "% or more." }));
    var rows = S.tests.slice().sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });
    var t = el("table");
    t.appendChild(el("thead", {}, [ el("tr", {}, ["Date","Channel","Creative","Spend","Impr.","Clicks","Installs","CTR","IPM","CPI","D1",""].map(function(h){ return el("th", { text:h }); })) ]));
    var tb = el("tbody");
    if(!rows.length) tb.appendChild(el("tr", {}, [ el("td", { colspan:"12", class:"muted", text:"No results yet. Add the first batch below." }) ]));
    rows.forEach(function(r){
      var sp = num(r.spend), im = num(r.impressions), cl = num(r.clicks), ins = num(r.installs), d1 = num(r.d1);
      var ctr = im && cl != null ? cl/im*100 : null, ipm = im && ins != null ? ins/im*1000 : null, cpi = ins && sp != null ? sp/ins : null;
      tb.appendChild(el("tr", {}, [
        el("td", { text:r.date||"" }), el("td", { text:r.channel||"" }), el("td", { text:r.creative||"" }),
        el("td", { class:"num", text: sp != null ? "$" + sp.toFixed(2) : "" }),
        el("td", { class:"num", text: im != null ? im.toLocaleString() : "" }),
        el("td", { class:"num", text: cl != null ? cl.toLocaleString() : "" }),
        el("td", { class:"num", text: ins != null ? ins.toLocaleString() : "" }),
        el("td", { class:"num", text: ctr != null ? ctr.toFixed(2) + "%" : "" }),
        el("td", { class:"num", text: ipm != null ? ipm.toFixed(1) : "" }),
        el("td", { class:"num " + (cpi == null ? "" : (cpi <= TARGET.cpi ? "good" : "bad")), text: cpi != null ? "$" + cpi.toFixed(2) : "" }),
        el("td", { class:"num " + (d1 == null ? "" : (d1 >= TARGET.d1 ? "good" : "bad")), text: d1 != null ? d1 + "%" : "" }),
        el("td", {}, [ el("button", { class:"btn ghost", text:"Remove", onclick:function(){ del("tests", r.id); } }) ])
      ]));
    });
    t.appendChild(tb); p.appendChild(el("div", { class:"tablewrap" }, [ t ]));
    var f = el("form", { class:"add card" });
    var fields = [["date","Date","date"],["channel","Channel","text"],["creative","Creative","text"],["spend","Spend ($)","number"],["impressions","Impressions","number"],["clicks","Clicks","number"],["installs","Installs","number"],["d1","Day-1 %","number"]];
    var inputs = {};
    fields.forEach(function(fd){
      var i = el("input", { id:"test-" + fd[0], type:fd[2], step: fd[2] === "number" ? "any" : null, placeholder: fd[0] === "channel" ? "TikTok paid" : (fd[0] === "creative" ? "BRA v ARG 12s" : null) });
      inputs[fd[0]] = i; f.appendChild(el("label", {}, [ fd[1], i ]));
    });
    f.appendChild(el("button", { class:"btn primary", type:"submit", text:"Add result" }));
    f.addEventListener("submit", function(e){
      e.preventDefault();
      var row = {};
      fields.forEach(function(fd){ var v = inputs[fd[0]].value.trim(); row[fd[0]] = fd[2] === "number" ? (v === "" ? null : Number(v)) : v; });
      if(!row.date && !row.channel){ notice("Add at least a date or a channel."); return; }
      notice(""); add("tests", row);
    });
    p.appendChild(f);
  }

  // ---------- matchups ----------
  var MSTAT = ["idea","filmed","posted","banned"];
  function renderMatchups(){
    var p = $('[data-panel="matchups"]'); p.textContent = "";
    p.appendChild(el("p", { class:"note", text:"Sports rivalries only. Mark a pair Banned if it touches an active war or territorial dispute; banned pairs never get filmed." }));
    var order = { posted:0, filmed:1, idea:2, banned:3 };
    S.matchups.slice().sort(function(a,b){ return (order[a.status]||0) - (order[b.status]||0) || byOrder(a,b); }).forEach(function(m){
      var st = el("select", { id:"m-st-" + m.id, "aria-label":"Status" });
      MSTAT.forEach(function(s){ var o = el("option", { value:s, text:s.charAt(0).toUpperCase() + s.slice(1) }); if(m.status === s) o.selected = true; st.appendChild(o); });
      st.addEventListener("change", function(){ upd("matchups", m.id, { status: st.value }); });
      var views = el("input", { id:"m-v-" + m.id, type:"number", min:"0", placeholder:"Views", "aria-label":"Views", style:"width:110px" }); if(m.views != null) views.value = m.views;
      var comments = el("input", { id:"m-c-" + m.id, type:"number", min:"0", placeholder:"Comments", "aria-label":"Comments", style:"width:110px" }); if(m.comments != null) comments.value = m.comments;
      function saveNums(){ upd("matchups", m.id, { views: views.value === "" ? null : Number(views.value), comments: comments.value === "" ? null : Number(comments.value) }); }
      views.addEventListener("change", saveNums); comments.addEventListener("change", saveNums);
      var per1k = (m.views && m.comments != null) ? (m.comments / m.views * 1000).toFixed(1) + " comments per 1k views" : "";
      p.appendChild(el("article", { class:"card" + (m.status === "banned" ? " banned" : "") }, [
        el("div", { class:"row spread" }, [
          el("div", { class:"vs" }, [ el("i", { class:"dot l" }), el("span", { text:m.left||"?" }), el("em", { text:"VS" }), el("i", { class:"dot r" }), el("span", { text:m.right||"?" }) ]),
          el("div", { class:"row" }, [ st, el("button", { class:"btn ghost", text:"Remove", onclick:function(){ del("matchups", m.id); } }) ])
        ]),
        m.note ? el("div", { class:"small muted", style:"margin-top:6px", text:m.note }) : null,
        m.status === "posted" ? el("div", { class:"row", style:"margin-top:8px" }, [ views, comments, el("span", { class:"small muted", text:per1k }) ]) : null
      ]));
    });
    var f = el("form", { class:"add card" });
    var l = el("input", { id:"m-left", placeholder:"Brazil", required:"" }), r = el("input", { id:"m-right", placeholder:"Argentina", required:"" }), n = el("input", { id:"m-note", placeholder:"Why this pair" });
    f.appendChild(el("label", {}, [ "Left lane", l ])); f.appendChild(el("label", {}, [ "Right lane", r ])); f.appendChild(el("label", {}, [ "Note", n ]));
    f.appendChild(el("button", { class:"btn primary", type:"submit", text:"Add matchup" }));
    f.addEventListener("submit", function(e){
      e.preventDefault(); if(!l.value.trim() || !r.value.trim()) return;
      add("matchups", { left:l.value.trim(), right:r.value.trim(), note:n.value.trim(), status:"idea", views:null, comments:null, order:Date.now() });
    });
    p.appendChild(f);
  }

  // ---------- jev ----------
  function answersOf(obj){
    if(!obj || typeof obj !== "object") return null;
    var cand = obj.answers || obj.results || obj.outputs || obj;
    var keys = Object.keys(cand).filter(function(k){ return cand[k] && typeof cand[k] === "object" && cand[k].type; });
    return keys.length ? cand : null;
  }
  function renderJev(){
    var p = $('[data-panel="jev"]'); p.textContent = "";
    p.appendChild(el("p", { class:"note", text:"Run the payload in docs/marketing in the jev Playground (State box: jev-state.json, Questions box: jev-questions.json), then paste the answer here. A choice or score with confidence under 0.5 is marked inconclusive." }));
    var ta = el("textarea", { id:"jev-paste", placeholder:"Paste the jev response JSON", "aria-label":"Jev response JSON" });
    var label = el("input", { id:"jev-label", placeholder:"Run name, e.g. first pass" });
    var f = el("form", { class:"card", style:"display:flex; flex-direction:column; gap:8px" }, [ ta, el("div", { class:"row" }, [ label, el("button", { class:"btn primary", type:"submit", text:"Save result" }) ]) ]);
    f.addEventListener("submit", function(e){
      e.preventDefault();
      var parsed; try{ parsed = JSON.parse(ta.value); }catch(err){ notice("That is not valid JSON. Paste the whole response, braces included."); return; }
      var a = answersOf(parsed); if(!a){ notice("No answers found. Each answer needs a type field (noul, choice or score)."); return; }
      notice(""); add("jev", { label: label.value.trim() || "Run", at: new Date().toISOString(), answers: a });
    });
    p.appendChild(f);
    var qs = (S.jevq && S.jevq.questions) || {};
    S.jev.slice().sort(function(a,b){ return String(b.at||"").localeCompare(String(a.at||"")); }).forEach(function(run){
      var card = el("article", { class:"card", style:"display:flex; flex-direction:column; gap:12px" }, [
        el("div", { class:"row spread" }, [ el("h3", { style:"font-size:15px", text:run.label || "Run" }), el("div", { class:"row" }, [
          el("span", { class:"small muted", text:(run.at||"").slice(0,10) }),
          el("button", { class:"btn ghost", text:"Remove", onclick:function(){ del("jev", run.id); } }) ]) ])
      ]);
      Object.keys(run.answers||{}).forEach(function(k){
        var a = run.answers[k], q = qs[k] || {}, ans = "", frac = null, low = false;
        if(a.type === "noul"){ frac = +a.noul; ans = Math.round(frac*100) + "% true"; }
        else if(a.type === "choice"){ low = a.confidence != null && a.confidence < 0.5; ans = String(a.choice) + (a.confidence != null ? " · conf " + (+a.confidence).toFixed(2) : ""); frac = a.probabilities && a.probabilities[a.choice] != null ? +a.probabilities[a.choice] : null; }
        else if(a.type === "score"){ low = a.confidence != null && a.confidence < 0.5; var levels = Array.isArray(q.criteria) ? q.criteria.length : null;
          ans = (+a.score).toFixed(2) + (levels ? " of " + (levels-1) : "") + (a.confidence != null ? " · conf " + (+a.confidence).toFixed(2) : ""); frac = levels ? (+a.score)/(levels-1) : null; }
        card.appendChild(el("div", { class:"jq" }, [
          el("div", {}, [ el("div", { class:"eyebrow", text:k.replace(/_/g," ") + " · " + a.type }), el("div", { class:"small muted", text:q.instructions || "" }) ]),
          el("div", { class:"ans" }, [ ans, low ? el("div", {}, [ el("span", { class:"chip warn", text:"Inconclusive" }) ]) : null ]),
          frac != null ? el("div", { class:"bar" }, [ el("i", { style:"width:" + Math.max(0, Math.min(100, frac*100)) + "%" }) ]) : null
        ]));
      });
      p.appendChild(card);
    });
  }

  function renderAll(){ renderPlan(); renderDecisions(); renderTasks(); renderTests(); renderMatchups(); renderJev(); renderStatus(); }
  renderAll();
  setMode("local");
  var use = window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null);
  use.then(function(a){ if(a){ art = a; setMode("publish"); } }, function(){});
})();
</script>
