<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080c">
<title>Outer Line</title>
<style>
  /* Outer Line: skating the space metro after hours. A late-night skate-video
     look: black tunnel, acid lime and hot magenta, heavy italic type, tape
     labels. System faces only, so it looks right on a locked-down Chromebook. */
  :root{
    color-scheme: dark;
    --void:#08080c; --tile:#15151d; --ink:#f4f4f0; --dim:#a8a8b4; --faint:#5c5c68;
    --lime:#c6ff00; --mag:#ff2e88; --cyan:#2ee6ff; --tape:#f2efe2;
    --heavy:'Arial Black', 'Helvetica Neue', Impact, system-ui, sans-serif;
    --mono:ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ margin:0; height:100%; background:var(--void); color:var(--ink); font-family:var(--heavy); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  [hidden]{ display:none !important; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .beanie canvas, .unl canvas{ position:static; display:block; }

  /* tape label */
  .tape{ display:inline-block; background:var(--tape); color:#111; font:900 italic 13px var(--heavy); letter-spacing:.04em; text-transform:uppercase; padding:5px 10px 4px; transform:rotate(-2deg); box-shadow:2px 3px 0 rgba(0,0,0,.45); }
  .tape.lime{ background:var(--lime); } .tape.mag{ background:var(--mag); color:#fff; }
  .page > .tape{ align-self:flex-start; }

  /* HUD */
  .hud-top{ position:fixed; left:12px; right:120px; top:calc(10px + env(safe-area-inset-top, 0px)); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .prog{ position:relative; height:4px; background:rgba(255,255,255,.12); max-width:420px; transform:skewX(-20deg); }
  .prog i{ position:absolute; left:0; top:0; bottom:0; width:0; background:var(--lime); box-shadow:0 0 10px var(--lime); }
  .hud-bot{ position:fixed; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom, 0px)); display:flex; align-items:flex-end; justify-content:space-between; gap:12px; pointer-events:none; }
  .spd{ font:900 italic clamp(40px, 9vw, 74px)/.85 var(--heavy); letter-spacing:-.02em; color:var(--ink); text-shadow:3px 3px 0 var(--mag); font-variant-numeric:tabular-nums; }
  .spd small{ font-size:.28em; letter-spacing:.1em; color:var(--lime); text-shadow:none; margin-left:4px; }
  .flow{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .flow b{ font:900 italic 14px var(--heavy); letter-spacing:.08em; color:var(--lime); text-transform:uppercase; }
  .flowbar{ width:min(46vw, 260px); height:14px; transform:skewX(-20deg); background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.2); position:relative; overflow:hidden; }
  .flowbar i{ position:absolute; left:0; top:0; bottom:0; width:0; background:linear-gradient(90deg, var(--cyan), var(--lime) 60%, var(--mag)); }
  .flowbar span{ position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,.6); }
  .score{ font:900 italic 15px var(--heavy); color:var(--dim); letter-spacing:.06em; }
  .tools{ position:fixed; right:12px; top:calc(10px + env(safe-area-inset-top, 0px)); display:flex; gap:8px; }
  .tool{ appearance:none; width:42px; height:42px; border:2px solid rgba(255,255,255,.25); background:rgba(8,8,12,.7); color:var(--ink); font:900 16px var(--heavy); cursor:pointer; transform:skewX(-8deg); }
  .tool:focus-visible, .btn:focus-visible, .spot:focus-visible{ outline:3px solid var(--lime); outline-offset:3px; }
  .hint{ position:fixed; left:0; right:0; top:calc(64px + env(safe-area-inset-top, 0px)); text-align:center; font:700 12px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); pointer-events:none; transition:opacity .6s; }

  /* screens: zine pages */
  .screen{ position:fixed; inset:0; overflow-y:auto; padding:calc(22px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.06) 1px, transparent 1.5px) 0 0/9px 9px,
      linear-gradient(160deg, rgba(255,46,136,.16), transparent 40%),
      rgba(8,8,12,.9); }
  .page{ max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  .logo{ font:900 italic clamp(54px, 13vw, 128px)/.82 var(--heavy); letter-spacing:-.03em; margin:0; color:var(--ink); text-shadow:5px 5px 0 var(--mag), 10px 10px 0 rgba(198,255,0,.35); transform:rotate(-3deg); transform-origin:left bottom; }
  .logo em{ font-style:italic; color:var(--lime); text-shadow:5px 5px 0 var(--mag); }
  .kicker{ font:700 12px var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--dim); margin:0; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .btn{ appearance:none; min-height:52px; padding:12px 24px; border:3px solid var(--ink); background:transparent; color:var(--ink); font:900 italic 18px var(--heavy); letter-spacing:.02em; text-transform:uppercase; cursor:pointer; transform:skewX(-10deg); box-shadow:5px 5px 0 rgba(0,0,0,.5); }
  .btn > span{ display:inline-block; transform:skewX(10deg); }
  .btn.go{ background:var(--lime); color:#0b0b0b; border-color:var(--lime); box-shadow:5px 5px 0 var(--mag); }
  .btn.mag{ border-color:var(--mag); color:var(--mag); }
  .btn:active{ transform:skewX(-10deg) translate(3px, 3px); box-shadow:2px 2px 0 rgba(0,0,0,.5); }
  .spots{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; }
  .spot{ appearance:none; text-align:left; border:0; padding:14px 14px 12px; background:#14141c; color:var(--ink); cursor:pointer; position:relative; transform:rotate(var(--r, 0deg)); box-shadow:4px 4px 0 rgba(0,0,0,.55); display:flex; flex-direction:column; gap:6px; min-height:104px; font-family:var(--heavy); }
  .spot .n{ font:900 italic 30px/1 var(--heavy); color:var(--sc, var(--lime)); }
  .spot .nm{ font:900 italic 15px/1.1 var(--heavy); text-transform:uppercase; }
  .spot .st{ font:700 11px var(--mono); letter-spacing:.08em; color:var(--dim); margin-top:auto; }
  .spot.locked{ cursor:default; opacity:.35; }
  .spot.done::after{ content:"LANDED"; position:absolute; right:-6px; top:-8px; background:var(--lime); color:#111; font:900 italic 10px var(--heavy); padding:3px 6px; transform:rotate(6deg); }
  .keys{ font:700 12px/1.9 var(--mono); color:var(--dim); letter-spacing:.04em; margin:0; }
  .keys b{ color:var(--lime); }
  .big{ font:900 italic clamp(40px, 10vw, 88px)/.88 var(--heavy); margin:0; letter-spacing:-.02em; text-shadow:4px 4px 0 var(--mag); }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:12px; }
  .stat{ background:#14141c; padding:12px 14px; box-shadow:4px 4px 0 rgba(0,0,0,.55); }
  .stat b{ display:block; font:900 italic 30px/1 var(--heavy); color:var(--lime); font-variant-numeric:tabular-nums; }
  .stat span{ font:700 11px var(--mono); letter-spacing:.14em; color:var(--dim); text-transform:uppercase; }
  .share{ font:700 14px/1.5 var(--mono); white-space:pre; background:#101016; border:2px dashed rgba(255,255,255,.25); padding:14px 16px; color:var(--ink); align-self:flex-start; max-width:100%; overflow-x:auto; }
  .toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%) rotate(-2deg); font:900 italic 14px var(--heavy); background:var(--lime); color:#111; padding:10px 14px; box-shadow:4px 4px 0 var(--mag); }
  .locker-head{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:6px; }
  .locker-head h2{ margin:0; font:900 italic 26px/1 var(--heavy); text-transform:uppercase; }
  .locker-head h2 em{ color:var(--lime); font-style:italic; }
  .locker{ display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:12px; }
  .beanie{ appearance:none; border:0; padding:8px 8px 10px; background:#14141c; color:var(--ink); cursor:pointer; box-shadow:4px 4px 0 rgba(0,0,0,.55); display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--heavy); position:relative; }
  .beanie canvas{ width:72px; height:72px; }
  .beanie .nm{ font:900 italic 13px/1.1 var(--heavy); text-transform:uppercase; text-align:center; }
  .beanie .how{ font:700 10px/1.3 var(--mono); letter-spacing:.04em; color:var(--dim); text-align:center; }
  .beanie.locked{ cursor:default; }
  .beanie.locked canvas{ opacity:.25; filter:grayscale(1); }
  .beanie.on{ box-shadow:inset 0 0 0 3px var(--lime), 4px 4px 0 rgba(0,0,0,.55); }
  .beanie:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .beanie.new:not(.on)::after{ content:"NEW"; position:absolute; right:-6px; top:-8px; background:var(--mag); color:#fff; font:900 italic 10px var(--heavy); padding:3px 6px; transform:rotate(6deg); }
  .beanie.on::after{ content:"ON"; position:absolute; right:-6px; top:-8px; background:var(--lime); color:#111; font:900 italic 10px var(--heavy); padding:3px 6px; transform:rotate(6deg); }
  .unlocks{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .unlocks .tape{ flex-basis:100%; max-width:max-content; }
  .unl{ margin:0; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .unl canvas{ width:56px; height:56px; background:#14141c; box-shadow:3px 3px 0 rgba(0,0,0,.5); }
  .unl figcaption{ font:900 italic 12px/1.1 var(--heavy); text-transform:uppercase; text-align:center; max-width:72px; color:var(--lime); }
  @media (max-width: 560px){ .hud-top{ right:108px; } .spots{ grid-template-columns:repeat(2, minmax(0, 1fr)); } .locker{ grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce){ .hint{ transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud-top" id="hudTop" hidden>
  <div><span class="tape" id="stnName">—</span></div>
  <div class="prog"><i id="progFill"></i></div>
</div>
<div class="hud-bot" id="hudBot" hidden>
  <div>
    <div class="spd" id="spd">0<small>KM/H</small></div>
    <div class="score" id="score">STYLE 0</div>
  </div>
  <div class="flow"><b id="flowTier">ROLLING</b><div class="flowbar"><i id="flowFill"></i><span style="left:33%"></span><span style="left:66%"></span></div></div>
</div>
<div class="tools">
  <button type="button" class="tool" id="mute" aria-label="Sound off">♪</button>
  <button type="button" class="tool" id="toMap" aria-label="Spots" hidden>☰</button>
</div>
<div class="hint" id="hint" hidden></div>

<section class="screen" id="mapScreen">
  <div class="page">
    <p class="kicker">A Trip and Route game · after hours on the metro · starring Scramble, an egg</p>
    <h1 class="logo">OUTER<br><em>LINE</em></h1>
    <div class="row">
      <button type="button" class="btn go" id="playNext"><span>Drop in</span></button>
      <button type="button" class="btn mag" id="playDaily"><span>Today's route</span></button>
    </div>
    <p class="keys" id="keys"></p>
    <div class="spots" id="spots"></div>
    <div class="locker-head"><h2><em id="eggName">Scramble</em>'s beanies</h2><span class="keys" id="lockerCount"></span></div>
    <div class="locker" id="locker"></div>
  </div>
</section>

<section class="screen" id="arriveScreen" hidden>
  <div class="page">
    <span class="tape lime">landed</span>
    <p class="big" id="arriveName">—</p>
    <div class="stats" id="arriveStats"></div>
    <div class="unlocks" id="arriveUnlocks" hidden></div>
    <div class="row">
      <button type="button" class="btn go" id="arriveNext"><span>Next stop</span></button>
      <button type="button" class="btn" id="arriveAgain"><span>Again</span></button>
      <button type="button" class="btn" id="arriveMap"><span>Spots</span></button>
    </div>
  </div>
</section>

<section class="screen" id="dailyScreen" hidden>
  <div class="page">
    <span class="tape mag" id="dailyHead">today's route</span>
    <p class="big" id="dailyPct">—</p>
    <div class="share" id="shareText"></div>
    <div class="unlocks" id="dailyUnlocks" hidden></div>
    <div class="row">
      <button type="button" class="btn go" id="copyShare"><span>Copy card</span></button>
      <button type="button" class="btn" id="dailyAgain"><span>Practice</span></button>
      <button type="button" class="btn" id="dailyMap"><span>Spots</span></button>
    </div>
    <p class="keys">Your first ride of the day goes on the card. Practice all you want after.</p>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";
(function(){
// ---------------------------------------------------------------- utils
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem("outerline." + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem("outerline." + k, JSON.stringify(v)); }catch(e){} }
};
var $ = function(id){ return document.getElementById(id); };
var TAU = Math.PI * 2;
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

// ---------------------------------------------------------------- the line
// Ten stops, easy to hard, each from its own seed so every rider gets the
// same ride. N = tunnel sides, C = tile columns per side, speed = base speed
// before momentum (flow multiplies it up to 1 + FLOW_MAX).
var STOPS = [
  { name:"Dockyard",       N:6, C:3, len:130, speed:10.0, holes:.12, gapEvery:30, gapLen:1, width:3, seed:11 },
  { name:"Lumen Avenue",   N:6, C:3, len:150, speed:10.5, holes:.24, gapEvery:24, gapLen:2, width:3, seed:23 },
  { name:"Halo Junction",  N:6, C:3, len:170, speed:11.0, holes:.36, gapEvery:22, gapLen:2, width:2, seed:37 },
  { name:"Quarry Steps",   N:6, C:3, len:180, speed:11.5, holes:.46, gapEvery:20, gapLen:2, width:2, seed:41 },
  { name:"Lantern Market", N:8, C:2, len:190, speed:12.0, holes:.42, gapEvery:18, gapLen:2, width:2, seed:53 },
  { name:"Orbit Park",     N:8, C:2, len:200, speed:12.5, holes:.54, gapEvery:16, gapLen:3, width:2, seed:67 },
  { name:"Glass Bridge",   N:8, C:2, len:210, speed:13.0, holes:.62, gapEvery:15, gapLen:3, width:1, seed:71 },
  { name:"Deep Siding",    N:6, C:3, len:220, speed:13.5, holes:.62, gapEvery:14, gapLen:3, width:1, seed:83 },
  { name:"Comet Yard",     N:8, C:2, len:230, speed:14.0, holes:.70, gapEvery:13, gapLen:3, width:1, seed:97 },
  { name:"Terminus",       N:6, C:3, len:260, speed:14.5, holes:.72, gapEvery:12, gapLen:3, width:1, seed:101 }
];
var SPOT_COLORS = ["#c6ff00", "#c6ff00", "#c6ff00", "#2ee6ff", "#2ee6ff", "#2ee6ff", "#ff2e88", "#ff2e88", "#ff2e88", "#ff2e88"];

// World units and feel. Lateral movement is a skater's: it accelerates,
// carries momentum, and slides to a stop instead of snapping.
var R = 3, D = 1.6, GRAV = 32, JUMP_V = 10.5;
var ACC = 46, AIR_ACC = 26, FRICTION = 1.5, AIR_FRICTION = .25, VL_BASE = 6.5, VL_FLOW = 3;
var FLOW_MAX = .8, TUCK = 1.15, FLOW_DECAY = .045, ROLL_W = 11, DEATH_T = .75, FADE_T = .3;

// A station: rows of tiles, 1 = floor. One guaranteed path of `width`
// tiles wanders around the tunnel (so you have to take the walls), every
// other tile drops with probability `holes`, and every `gapEvery` rows a
// gap of `gapLen` rows needs a jump. After every sideways shift the old
// column stays for as many rows as a full sideways step takes (accelerate
// and stop: 2*sqrt(tileW/ACC)) at the top speed this stop can reach.
function buildStation(p, seedOverride){
  var rng = mulberry32((seedOverride != null ? seedOverride : p.seed) * 2654435761 >>> 0);
  var cols = p.N * p.C, rows = [], path = Math.floor(rng() * cols), drift = 0, start = path, trail = [];
  var tileW = 2 * R * Math.sin(Math.PI / p.N) / p.C, vTop = p.speed * (1 + FLOW_MAX) * TUCK;
  var keep = Math.ceil((2 * Math.sqrt(tileW / ACC) + .08) * vTop / D) + 1, hist = [];
  var START = 12, END = 8;
  for(var r = 0; r < p.len; r++){
    var row = new Uint8Array(cols);
    if(r < START || r >= p.len - END){ row.fill(1); rows.push(row); trail.push(path); continue; }
    if(r % 2 === 0){
      if(rng() < .35) drift = rng() < .5 ? -1 : 1;
      if(rng() < .3) drift = 0;
      path = (path + drift + cols) % cols;
    }
    for(var c = 0; c < cols; c++) row[c] = rng() < p.holes ? 0 : 1;
    hist.push(path); if(hist.length > keep) hist.shift();
    for(var hi = 0; hi < hist.length; hi++) for(var w = 0; w < p.width; w++) row[(hist[hi] + w) % cols] = 1;
    if(p.gapEvery && r > START + 4 && r < p.len - END - 6 && (r - START) % p.gapEvery === 0){
      for(var g = 0; g < p.gapLen; g++){ rows.push(new Uint8Array(cols)); trail.push(path); r++; }
      var land = new Uint8Array(cols); land.fill(1); rows.push(land); trail.push(path);
      continue;
    }
    rows.push(row); trail.push(path);
  }
  return { p:p, N:p.N, C:p.C, cols:cols, rows:rows, len:rows.length, start:start, trail:trail, width:p.width };
}

// Today's route: the same for everyone; UTC day, #1 = 2026-10-25.
function dailyInfo(){
  var now = new Date(), day = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  var n = Math.floor((day - Date.UTC(2026, 9, 25)) / 864e5) + 1;
  return { n:n, key:new Date(day).toISOString().slice(0, 10), p:dailyParams(n), reset:new Date(day + 864e5) };
}
function dailyParams(n){
  var r = mulberry32(n * 7919 >>> 0);
  var p = { name:"Route " + n, N: r() < .5 ? 6 : 8, C:0, len:220, speed:12 + r() * 1.5, holes:.5 + r() * .15, gapEvery:15, gapLen:2 + (r() < .5 ? 1 : 0), width:1, seed:n * 104729 };
  p.C = p.N === 8 ? 2 : 3;
  return p;
}

// ---------------------------------------------------------------- geometry
function geom(N){
  var S = 2 * R * Math.sin(Math.PI / N), V = [];
  for(var k = 0; k <= N; k++){ var a = -Math.PI / 2 - Math.PI / N + k * TAU / N; V.push([R * Math.cos(a), R * Math.sin(a)]); }
  return { N:N, S:S, P:N * S, V:V };
}
// A point on the perimeter at arc length p, and the inward normal ("up") there.
function surf(G, p){
  p = ((p % G.P) + G.P) % G.P;
  var s = Math.min(G.N - 1, Math.floor(p / G.S)), t = (p - s * G.S) / G.S, a = G.V[s], b = G.V[s + 1];
  return { x:a[0] + (b[0] - a[0]) * t, y:a[1] + (b[1] - a[1]) * t, s:s, up:Math.PI / 2 + s * TAU / G.N };
}
// The view's "up", continuous around the tunnel: a side's own normal across
// its middle, easing (smoothstep) into the next side's over the stretch
// before each corner, so the camera never steps when you change walls.
var UP_BAND = 1;
function upAt(G, p){
  p = ((p % G.P) + G.P) % G.P;
  var s = Math.min(G.N - 1, Math.floor(p / G.S)), u = (p - s * G.S) / G.S * 2 - 1, a = Math.abs(u);
  var e = a < 1 - UP_BAND ? 0 : (a - (1 - UP_BAND)) / UP_BAND; e = e * e * (3 - 2 * e);
  return Math.PI / 2 + s * TAU / G.N + (u < 0 ? -1 : 1) * e * Math.PI / G.N;
}
function wrapA(a){ return ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; }

// ---------------------------------------------------------------- state
var cv = $("c"), ctx = cv.getContext("2d"), W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize); resize();

var S = {
  mode:"map", st:null, G:null, stopIdx:0, daily:null, dailyFirst:false,
  p:0, vl:0, h:0, vh:0, z:0, grounded:true, dead:0, roll:Math.PI / 2, rollV:0, side:0, t:0, arrived:false,
  flow:0, style:0, combo:0, comboT:0, topSpeed:0, bestCombo:0, landT:9, airGap:false, airSide:false, airT:0, edgeT:0, onEdge:false, shake:0, tier:0, wallT:-9, starPh:0, linePh:0, flowS:0, tuckS:0, leanS:0, cam:null,
  best: store.get("best", 0), bestStyle: store.get("bestStyle", {})
};
var input = { left:false, right:false, tuck:false, jumpQ:0 };
var pops = [];   // trick callouts drawn on the canvas

// Speed follows flow and the tuck through a short ease, so a trick is a
// surge rather than a jolt.
function speedNow(){ return S.st ? S.st.p.speed * (1 + S.flowS * FLOW_MAX) * (1 + (TUCK - 1) * S.tuckS) : 0; }

function startStation(params, opts){
  opts = opts || {};
  S.st = buildStation(params, opts.seed);
  S.G = geom(S.st.N);
  S.p = (S.st.start + S.st.width / 2) * (S.G.S / S.st.C) % S.G.P;
  S.vl = 0; S.h = 0; S.vh = 0; S.z = 0; S.grounded = true; S.dead = 0; S.arrived = false; S.t = 0;

(function(){ var r = mulberry32(7); for(var i = 0; i < 260; i++) stars.push([r() * TAU, r(), .5 + r() * 1.6, r()]); })();
function hexRgb(h){ var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function draw(){
  var flow = S.st ? S.flowS : 0, sp = speedNow();
  ctx.fillStyle = "#08080c"; ctx.fillRect(0, 0, W, H);
  // shake is a smooth wobble, not per-frame noise, so it reads as weight
  var shx = S.shake * 7 * (Math.sin(S.t * 41) + Math.sin(S.t * 27.3 + 1.7)) / 2, shy = S.shake * 7 * (Math.sin(S.t * 37.1 + .6) + Math.sin(S.t * 23.9 + 2.9)) / 2;
  var cx = W / 2 + shx, cy = H * .48 + shy;
  // a wider lens as you speed up
  var f = Math.min(W, H) * .9 * (1 - .24 * flow);
  var roll = S.st ? S.roll - Math.PI / 2 : 0;
  // stars stream past at speed
  for(var i = 0; i < stars.length; i++){
    var s = stars[i], a = s[0] - roll, rr = (.15 + ((s[1] + S.starPh * (.4 + s[3])) % 1) * .95) * Math.max(W, H);
    var len = 1 + sp * .25 * s[3] * (.3 + flow);
    ctx.strokeStyle = "rgba(240,240,255," + (.18 + s[1] * .45).toFixed(2) + ")"; ctx.lineWidth = s[2];
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); ctx.lineTo(cx + Math.cos(a) * (rr + len), cy + Math.sin(a) * (rr + len)); ctx.stroke();
  }
  if(!S.st) return;
  var st = S.st, G = S.G, tw = G.S / st.C;
  var me = surf(G, S.p), lean = S.leanS;
  var up = S.roll + lean * .05, ux = Math.cos(up), uy = Math.sin(up), rx = Math.sin(up), ry = -Math.cos(up);
  var camH = 1.25 + Math.max(0, S.h) * .5, camZ = S.z - (4.2 + flow * 1.4);
  // the camera sits above the rider along the smoothed roll, not the side's
  // normal, so changing walls never jumps it
  var mx = me.x + Math.cos(S.roll) * camH, my = me.y + Math.sin(S.roll) * camH;
  var camX = mx * .8, camY = my * .8;
  S.cam = { up:up, x:camX, y:camY, z:camZ, f:1 - .24 * flow };
  function proj(x, y, z){
    var dz = z - camZ; if(dz < .15) return null;
    var dx = x - camX, dy = y - camY;
    return [cx + f * (dx * rx + dy * ry) / dz, cy - f * (dx * ux + dy * uy) / dz + f * .06, dz];
  }
  var r0 = Math.max(0, Math.floor(camZ / D)), r1 = Math.min(st.len + 8, r0 + 70);
  var rgb = hexRgb(S.color), NEAR = .4;
  // how much each side is "the floor" right now, from the smoothed roll, so
  // the highlight slides across with the camera instead of flipping
  var sideW = [];
  for(var si = 0; si < G.N; si++) sideW.push(clamp(1 - Math.abs(wrapA(Math.PI / 2 + si * TAU / G.N - S.roll)) / (TAU / G.N), 0, 1));
  for(var r = r1; r >= r0; r--){
    // rows are clipped at a near plane instead of vanishing whole, so tiles
    // slide out of the bottom of the screen rather than popping

    if(z1 <= z0) continue;
    var fd = (r * D - camZ) / (70 * D), fog = Math.max(0, 1 - fd); fog = fog * fog * (3 - 2 * fog);
    if(fog <= 0) continue;
    // lines thinner than a few pixels on screen shimmer, so far rows fade them out
    var px = f * D / Math.max(.5, r * D - camZ), lineA = clamp((px - 3) / 9, 0, 1);
    var finish = r >= st.len - 8, seam = r % 8 === 0;
    for(var c = 0; c < st.cols; c++){
      if(row && !row[c]) continue;
      var A = surf(G, c * tw + tw * .04), B = surf(G, (c + 1) * tw - tw * .04);
      var q0 = proj(A.x, A.y, z0), q1 = proj(B.x, B.y, z0), q2 = proj(B.x, B.y, z1), q3 = proj(A.x, A.y, z1);
      if(!q0 || !q1 || !q2 || !q3) continue;
      var w = sideW[Math.floor(c / st.C)];
      ctx.beginPath(); ctx.moveTo(q0[0], q0[1]); ctx.lineTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]); ctx.lineTo(q3[0], q3[1]); ctx.closePath();
      if(finish){ ctx.fillStyle = ((r + c) % 2) ? "rgba(244,244,240," + (.8 * fog).toFixed(3) + ")" : "rgba(8,8,12," + (.9 * fog).toFixed(3) + ")"; ctx.fill(); continue; }
      var shade = Math.round(20 + 10 * w);
      ctx.fillStyle = "rgba(" + shade + "," + shade + "," + (shade + 10) + "," + (.96 * fog).toFixed(3) + ")";
      ctx.fill();
      var glow = (.32 + .43 * w) * fog * (seam ? 1.6 : 1) * (seam ? Math.max(lineA, .35) : lineA);
      if(glow < .01) continue;
      ctx.strokeStyle = seam ? "rgba(255,46,136," + Math.min(1, glow).toFixed(3) + ")" : "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + glow.toFixed(3) + ")";
      ctx.lineWidth = 1 + .6 * w; ctx.stroke();
    }
  }
  // speed lines
  var nLines = Math.round(10 + 70 * flow + 20 * S.tuckS);
  ctx.strokeStyle = "rgba(255,255,255," + (.06 + .18 * flow).toFixed(3) + ")"; ctx.lineWidth = 2;
  ctx.beginPath();
  for(var k = 0; k < nLines; k++){
    var ang = (k * 2.399 + S.t * 3) % TAU, r1s = Math.max(W, H) * (.35 + ((k * .618 + S.linePh) % 1) * .5), r2s = r1s + 30 + sp * 3 * (.5 + flow);
    ctx.moveTo(cx + Math.cos(ang) * r1s, cy + Math.sin(ang) * r1s); ctx.lineTo(cx + Math.cos(ang) * r2s, cy + Math.sin(ang) * r2s);
  }
  ctx.stroke();
  drawSkater(proj, me, lean, f);
  // callouts
  ctx.save(); ctx.textAlign = "center";
  for(var j = 0; j < pops.length; j++){
    var pp = pops[j], tt = pp.t, sc = tt < .12 ? .6 + tt / .12 * .55 : 1.15 - Math.min(.15, (tt - .12) * .6), al = tt > .75 ? Math.max(0, 1 - (tt - .75) / .35) : 1;
    var size = (pp.big ? 46 : 32) * Math.min(1.4, Math.min(W, H) / 700 + .4);
    ctx.save();
    ctx.translate(W / 2 + pp.x * W, H * (.22 + (pops.length - 1 - j) * .075) - tt * 26);
    ctx.rotate(pp.rot);
    ctx.font = "italic 900 " + Math.round(size) + "px 'Arial Black', Impact, system-ui, sans-serif";
    // never wider than the screen, pop and shadow included
    var fit = Math.min(1, W * .92 / ((ctx.measureText(pp.text).width + 4) * 1.15));
    ctx.scale(sc * fit, sc * fit); ctx.globalAlpha = al;
    ctx.fillStyle = "#ff2e88"; ctx.fillText(pp.text, 4, 4);
    ctx.fillStyle = pp.color === "#ff2e88" ? "#c6ff00" : "#f4f4f0"; ctx.fillText(pp.text, 0, 0);
    if(pp.sub){ ctx.font = "italic 900 " + Math.round(size * .6) + "px 'Arial Black', Impact, system-ui, sans-serif"; ctx.fillStyle = "#f4f4f0"; ctx.fillText(pp.sub, 0, size * .85); }
    ctx.restore();
  }
  ctx.restore();
  // a short dip to black hides the cut from a fall back to the start
  if(S.mode === "ride"){
    var fade = S.dead > 0 ? clamp((FADE_T - S.dead) / FADE_T, 0, 1) : clamp(1 - S.t / FADE_T, 0, 1);
    if(fade > 0){ fade = fade * fade * (3 - 2 * fade); ctx.fillStyle = "rgba(8,8,12," + fade.toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
  }
  // HUD numbers
  var prog = Math.min(1, S.z / D / st.len);
  $("progFill").style.width = (prog * 100).toFixed(1) + "%";
  $("spd").firstChild.nodeValue = String(Math.round(sp * 10));
  $("flowFill").style.width = (S.flow * 100).toFixed(1) + "%";
  $("flowTier").textContent = TIERS[S.flow >= .66 ? 2 : S.flow >= .33 ? 1 : 0] + (S.combo > 1 ? "  ×" + S.combo : "");
  $("score").textContent = "STYLE " + S.style.toLocaleString("en-US");
}
// The rider: Scramble, a smooth green egg on a skateboard, seen from behind, riding the
// board nose-first down the tunnel. The board is a real 3D quad (nose ahead, tail behind) that yaws
// toward where you're carving; the feet stand on it side by side, facing
// forward, and the egg turns a little into the carve. Squashes on a tuck and a
// landing, stretches and throws its arms up in the air.
function drawSkater(proj, me, lean, f){
  var upC = upAt(S.G, S.p), hh = Math.max(-3, S.h), ux = Math.cos(upC), uy = Math.sin(upC);
  var bx = me.x + ux * hh, by = me.y + uy * hh, bz = S.z;
  var P = proj(bx, by, bz); if(!P) return;
  var k = f / P[2] * .82;   // pixels per world unit at the rider, drawn a touch small so the track stays readable
  // a soft shadow on the floor below, so you can read where you'll land
  var Q = S.h > .05 && tileAt(S.p, S.z) ? proj(me.x, me.y, S.z) : null;
  if(Q){
    var ks = f / Q[2] * .82, sa = Math.max(0, .45 - S.h * .12);
    ctx.fillStyle = "rgba(0,0,0," + sa.toFixed(3) + ")"; ctx.beginPath(); ctx.ellipse(Q[0], Q[1], ks * .2, ks * .3, 0, 0, TAU); ctx.fill();
  }
  // heading: forward speed against sideways speed, from the eased lean
  var a = surf(S.G, S.p - .02), b = surf(S.G, S.p + .02), Lx = b.x - a.x, Ly = b.y - a.y, Ll = Math.hypot(Lx, Ly) || 1; Lx /= Ll; Ly /= Ll;
  // a fall spins up from rest (no snap), about one turn by the restart
  var spin = S.dead > 0 ? Math.pow(DEATH_T - S.dead, 2) * 12 : 0;
  var yaw = Math.atan2(lean * (VL_BASE + VL_FLOW), Math.max(1, speedNow())) * .55 + spin;
  var sy = Math.sin(yaw), cy = Math.cos(yaw);
  // a point on the board: fo along the board, si across it, up above the floor
  function bp(fo, si, up){ return proj(bx + Lx * (sy * fo + cy * si) + ux * up, by + Ly * (sy * fo + cy * si) + uy * up, bz + cy * fo - sy * si); }
  function poly(pts){ for(var i = 0; i < pts.length; i++) if(!pts[i]) return false; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for(var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]); ctx.closePath(); return true; }
  var g = ctx.createRadialGradient(P[0], P[1], k * .05, P[0], P[1], k * .7);

  // wheels, then the deck's dark edge, then the deck with kicked-up nose and tail
  ctx.fillStyle = "#111";
  [[.3, .09], [.3, -.09], [-.3, .09], [-.3, -.09]].forEach(function(w){ var q = bp(w[0], w[1], .035); if(q){ ctx.beginPath(); ctx.arc(q[0], q[1], Math.max(1, f / q[2] * .82 * .045), 0, TAU); ctx.fill(); } });

  if(poly(deck(.1))){ ctx.fillStyle = "#c6ff00"; ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1; ctx.stroke(); }

    ctx.bezierCurveTo(-rx * .55, cyE + ry, -rx, cyE + ry * .8, -rx, cyE + ry * .25);

  ctx.restore();
}

// ---------------------------------------------------------------- screens
function showScreen(id){ ["mapScreen", "arriveScreen", "dailyScreen"].forEach(function(s){ $(s).hidden = s !== id; }); if(id){ $("hudTop").hidden = true; $("hudBot").hidden = true; $("toMap").hidden = true; } }
function hint(text, ms){ var h = $("hint"); h.textContent = text; h.hidden = false; h.style.opacity = "1"; clearTimeout(hint.t); hint.t = setTimeout(function(){ h.style.opacity = "0"; }, ms); }
function toast(text){ var t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.hidden = true; }, 1800); }
function renderMap(){
  $("spots").innerHTML = STOPS.map(function(s, i){
    var open = i <= S.best, done = i < S.best, bs = S.bestStyle[i];
    return '<button type="button" class="spot' + (open ? "" : " locked") + (done ? " done" : "") + '" data-i="' + i + '" style="--r:' + ((i * 37 % 7) - 3) * .6 + 'deg;--sc:' + SPOT_COLORS[i] + '"' + (open ? "" : " disabled") + '>' +
      '<span class="n">' + String(i + 1).padStart(2, "0") + '</span><span class="nm">' + s.name + '</span>' +
      '<span class="st">' + (open ? (bs ? "best " + bs.toLocaleString("en-US") : "not landed yet") : "locked") + '</span></button>';
  }).join("");
  $("spots").querySelectorAll(".spot").forEach(function(b){ b.addEventListener("click", function(){ rideStop(+b.dataset.i); }); });
  var nx = Math.min(S.best, STOPS.length - 1);
  $("playNext").firstChild.textContent = S.best >= STOPS.length ? "Run it back" : "Drop in: " + STOPS[nx].name;
  $("keys").innerHTML = touchy ? "<b>hold</b> a side to carve · <b>tap</b> or <b>swipe up</b> to jump · <b>hold both</b> to tuck · walls become floors · chain tricks for speed"
    : "<b>← →</b> carve · <b>↑</b> jump · <b>↓</b> tuck · walls become floors · chain wall rides, gaps and hops to build speed";
}
function toMap(){
  // quitting the first ride of the day still uses it up, as a fall would
  if(S.mode === "ride" && S.daily && S.dailyFirst && S.st){ store.set("daily", { key:S.daily.key, pct:Math.min(99, Math.floor(S.z / D / S.st.len * 100)), style:S.style }); S.dailyFirst = false; }
  S.mode = "map"; S.st = null; S.daily = null; input.left = input.right = input.tuck = false;
  fresh.forEach(function(id){ if(unseen.indexOf(id) < 0) unseen.push(id); }); fresh = [];
  renderMap(); renderLocker(); showScreen("mapScreen");
}
function rideStop(i){ ac(); S.stopIdx = i; S.daily = null; startStation(STOPS[i]); }
function arrive(){
  S.mode = "arrive"; SFX.arrive();
  if(S.daily){ finishDaily(100); return; }
  if(S.stopIdx + 1 > S.best){ S.best = S.stopIdx + 1; store.set("best", S.best); }
  checkProgress(false);
  if(!S.bestStyle[S.stopIdx] || S.style > S.bestStyle[S.stopIdx]){ S.bestStyle[S.stopIdx] = S.style; store.set("bestStyle", S.bestStyle); }
  $("arriveName").textContent = STOPS[S.stopIdx].name;
  $("arriveStats").innerHTML = [["style", S.style.toLocaleString("en-US")], ["top speed", Math.round(S.topSpeed * 10)], ["best combo", "×" + S.bestCombo]]
    .map(function(x){ return '<div class="stat"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>'; }).join("");
  var last = S.stopIdx === STOPS.length - 1;
  $("arriveNext").firstChild.textContent = last ? "Back to Dockyard" : "Next: " + STOPS[S.stopIdx + 1].name;
  showUnlocks("arriveUnlocks");
  $("arriveNext")[$("arriveUnlocks").hidden ? "removeAttribute" : "setAttribute"]("aria-describedby", "arriveUnlocks");
  setTimeout(function(){ showScreen("arriveScreen"); $("arriveNext").focus(); }, 380);
}
$("arriveNext").addEventListener("click", function(){ rideStop(S.stopIdx === STOPS.length - 1 ? 0 : S.stopIdx + 1); });
$("arriveAgain").addEventListener("click", function(){ rideStop(S.stopIdx); });
$("arriveMap").addEventListener("click", toMap);
$("toMap").addEventListener("click", toMap);
$("playNext").addEventListener("click", function(){ rideStop(Math.min(S.best, STOPS.length - 1)); });
$("playDaily").addEventListener("click", function(){ playDaily(false); });
function playDaily(practice){
  ac();
  var d = dailyInfo(), rec = store.get("daily", {});
  S.daily = d; S.dailyFirst = !practice && rec.key !== d.key;
  startStation(d.p, { color:"#ff2e88", label:"TODAY'S ROUTE #" + d.n + (S.dailyFirst ? "" : " · PRACTICE") });
}
function finishDaily(pct){
  var d = S.daily, rec = store.get("daily", {});
  if(S.dailyFirst){ rec = { key:d.key, pct:pct, style:S.style }; store.set("daily", rec); S.dailyFirst = false; if(pct >= 100) unlock("daily"); }
  S.mode = "daily";
  var mine = rec.key === d.key ? rec.pct : pct, style = rec.key === d.key ? rec.style : S.style;
  var bar = ""; for(var i = 0; i < 10; i++) bar += i < Math.round(mine / 10) ? "🟩" : "⬛";
  var text = "OUTER LINE · ROUTE #" + d.n + "\n" + bar + " " + mine + "%\nstyle " + style.toLocaleString("en-US") + (mine >= 100 ? " · landed" : "");
  $("dailyHead").textContent = "today's route #" + d.n;
  $("dailyPct").textContent = mine >= 100 ? "LANDED" : mine + "%";
  $("shareText").textContent = text;
  showUnlocks("dailyUnlocks");
  $("copyShare")[$("dailyUnlocks").hidden ? "removeAttribute" : "setAttribute"]("aria-describedby", "dailyUnlocks");
  showScreen("dailyScreen");
}
$("copyShare").addEventListener("click", function(){
  var t = $("shareText").textContent;
  var ok = function(){ toast("Copied. Post it."); }, no = function(){ var r = document.createRange(); r.selectNodeContents($("shareText")); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected. Copy it from here."); };
  try{ navigator.clipboard.writeText(t).then(ok, no); }catch(e){ no(); }
});
$("dailyAgain").addEventListener("click", function(){ playDaily(true); });
$("dailyMap").addEventListener("click", toMap);

// ---------------------------------------------------------------- loop
var last = 0;
function frame(ts){
  var dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts;
  var n = Math.max(1, Math.ceil(dt / .01));
  for(var i = 0; i < n; i++) update(dt / n);
  draw();
  requestAnimationFrame(frame);
}
checkProgress(true);
renderMap(); renderLocker(); showScreen("mapScreen");
requestAnimationFrame(frame);

if(/[?&]test=1(&|$)/.test(location.search)) window.__ol = { S:S, STOPS:STOPS, input:input, buildStation:buildStation, dailyInfo:dailyInfo, dailyParams:dailyParams, tileAt:tileAt, rideStop:rideStop, playDaily:playDaily, startStation:startStation, update:update, surf:surf, speedNow:speedNow, pops:pops, draw:draw, upAt:upAt, BEANIES:BEANIES, owned:function(){ return owned.slice(); }, worn:function(){ return worn; }, wear:wear, unlock:unlock, checkProgress:checkProgress, renderLocker:renderLocker, D:D, VL_BASE:VL_BASE, VL_FLOW:VL_FLOW };
// An embedding page that inlines the game sets window.__OL_START first.
var startWith = window.__OL_START || (/[?&]daily=1(&|$)/.test(location.search) ? "daily" : (/[?&]play=1(&|$)/.test(location.search) ? "play" : ""));
if(startWith === "daily") playDaily(false);
else if(startWith === "play") rideStop(Math.min(S.best, STOPS.length - 1));
})();
