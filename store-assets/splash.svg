<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732">
  <defs>
    <!-- seam: faint channel (unfilled), teal halo, bright core with a hot tip -->
    <linearGradient id="chan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eef0f4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eef0f4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#eef0f4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7dd3c0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3c0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef0f4"/>
      <stop offset="0.09" stop-color="#7dd3c0"/>
      <stop offset="1" stop-color="#7dd3c0"/>
    </linearGradient>
    <radialGradient id="tip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eef0f4" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#7dd3c0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </radialGradient>
    <!-- orb glows: the game's shadowBlur as radial gradients, kept tight so the
         discs stay hard-edged at 60px -->
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#ffb454" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ec8ff" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#5ec8ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2732" height="2732" fill="#0b0d11"/>
  <path d="M0 64H2732M0 128H2732M0 192H2732M0 256H2732M0 320H2732M0 384H2732M0 448H2732M0 512H2732M0 576H2732M0 640H2732M0 704H2732M0 768H2732M0 832H2732M0 896H2732M0 960H2732M0 1024H2732M0 1088H2732M0 1152H2732M0 1216H2732M0 1280H2732M0 1344H2732M0 1408H2732M0 1472H2732M0 1536H2732M0 1600H2732M0 1664H2732M0 1728H2732M0 1792H2732M0 1856H2732M0 1920H2732M0 1984H2732M0 2048H2732M0 2112H2732M0 2176H2732M0 2240H2732M0 2304H2732M0 2368H2732M0 2432H2732M0 2496H2732M0 2560H2732M0 2624H2732M0 2688H2732" stroke="#eef0f4" stroke-width="2" opacity="0.06"/>
  <g transform="translate(956.20 956.20) scale(0.80039)">

  <!-- orb glows sit under the seam so the channel reads as in front of the light -->
  <circle cx="338" cy="512" r="190" fill="url(#glowL)"/>
  <circle cx="686" cy="512" r="190" fill="url(#glowR)"/>

  <!-- the seam: full-height channel, halo, core, hot tip, gauge foot -->
  <rect x="452" y="0" width="120" height="1024" fill="url(#chan)"/>
  <rect x="422" y="136" width="180" height="768" fill="url(#halo)"/>
  <rect x="482" y="136" width="60" height="768" rx="30" fill="url(#core)"/>
  <ellipse cx="512" cy="144" rx="170" ry="120" fill="url(#tip)"/>
  <rect x="448" y="896" width="128" height="16" rx="8" fill="#7dd3c0"/>
  <rect x="392" y="901" width="240" height="6" rx="3" fill="#7dd3c0" opacity="0.28"/>

  <!-- the entangled pair: buzz, then flat discs over the bar's edges -->
  <path d="M417.1 673.8L408.1 696.9M368.1 688.6L386.9 710.5M304.8 689.7L316.0 738.9M231.5 655.9L241.2 682.7M204.2 639.4L200.4 689.0M157.8 553.3L121.6 547.4M153.8 486.1L114.3 453.8M163.2 474.5L137.8 474.6M187.1 418.6L148.4 406.4M242.8 355.1L233.1 307.8M316.6 332.0L288.1 312.0M350.3 321.8L328.6 298.0" stroke="#ffb454" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none"/>
  <path d="M870.5 512.6L904.2 519.6M851.9 593.0L864.3 601.5M822.5 634.2L826.1 671.7M783.2 671.4L824.0 687.5M734.3 685.8L749.8 708.6M650.8 686.5L638.6 718.2M609.1 339.2L567.3 332.7M629.7 331.1L622.8 301.9M705.4 329.0L677.5 289.7M780.9 362.9L804.0 344.7M841.6 416.0L860.2 391.8M852.1 424.5L884.4 429.6" stroke="#5ec8ff" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none"/>
  <circle cx="338" cy="512" r="160" fill="#ffb454"/>
  <circle cx="686" cy="512" r="160" fill="#5ec8ff"/>
  </g>
</svg>
