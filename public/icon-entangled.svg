<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <radialGradient id="vig" cx="50%" cy="56%" r="62%">
    <stop offset="0" stop-color="#1a1e26"/>
    <stop offset="1" stop-color="#0b0d11"/>
  </radialGradient>
  <linearGradient id="seam" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#7dd3c0" stop-opacity="1"/>
    <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
  </linearGradient>
  <pattern id="lines" width="1024" height="56" patternUnits="userSpaceOnUse">
    <rect width="1024" height="2" fill="#eef0f4" fill-opacity="0.045"/>
  </pattern>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<!-- stage: opaque, vignetted, faint horizontal scan lines -->
<rect width="1024" height="1024" fill="#0b0d11"/>
<rect width="1024" height="1024" fill="url(#vig)"/>
<rect width="1024" height="1024" fill="url(#lines)"/>

<!-- the seam: channel between the two sides, filling upward into the bell -->
<rect x="504" y="336" width="16" height="424" rx="8" fill="url(#seam)" opacity="0.5" filter="url(#soft)"/>
<rect x="505" y="336" width="14" height="424" rx="7" fill="url(#seam)"/>

