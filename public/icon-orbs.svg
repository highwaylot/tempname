<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- seam: faint channel (unfilled), teal halo, bright core -->
    <linearGradient id="chan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eef0f4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#eef0f4" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#eef0f4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7dd3c0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3c0" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef0f4"/>
      <stop offset="0.18" stop-color="#7dd3c0"/>
      <stop offset="1" stop-color="#7dd3c0"/>
    </linearGradient>
    <!-- the leading edge of the fill: a hot spot where the tank is rising -->
    <radialGradient id="tip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eef0f4" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#7dd3c0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </radialGradient>
    <!-- orb glows: the game's shadowBlur, as radial gradients -->
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ffb454" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5ec8ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#5ec8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5ec8ff" stop-opacity="0"/>
    </radialGradient>
    <!-- a touch of sphere: the orb is lit by the seam beside it -->
    <radialGradient id="orbL" cx="0.62" cy="0.40" r="0.72">
      <stop offset="0" stop-color="#ffd08e"/>
      <stop offset="0.55" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#e0923a"/>
    </radialGradient>
    <radialGradient id="orbR" cx="0.38" cy="0.40" r="0.72">
      <stop offset="0" stop-color="#a6e2ff"/>
      <stop offset="0.55" stop-color="#5ec8ff"/>
      <stop offset="1" stop-color="#2f9fdc"/>
    </radialGradient>
  </defs>

  <!-- stage: fully opaque, iOS forbids alpha -->
  <rect width="1024" height="1024" fill="#0b0d11"/>
  <path d="M0 64H1024M0 128H1024M0 192H1024M0 256H1024M0 320H1024M0 384H1024M0 448H1024M0 512H1024M0 576H1024M0 640H1024M0 704H1024M0 768H1024M0 832H1024M0 896H1024M0 960H1024" stroke="#eef0f4" stroke-width="2" opacity="0.06"/>

  <!-- seam channel, full height (the unfilled part of the tank) -->
  <rect x="472" y="0" width="80" height="1024" fill="url(#chan)"/>

  <!-- orb glows sit under the seam so the seam reads as in front -->
  <circle cx="330" cy="512" r="250" fill="url(#glowL)"/>
  <circle cx="694" cy="512" r="250" fill="url(#glowR)"/>

  <!-- boost tank fill rising up the seam -->
  <rect x="432" y="236" width="160" height="666" fill="url(#halo)"/>
  <ellipse cx="512" cy="242" rx="150" ry="110" fill="url(#tip)"/>
  <rect x="502" y="236" width="20" height="666" rx="10" fill="url(#core)"/>
  <!-- gauge foot on the bottom safe edge -->
  <rect x="464" y="898" width="96" height="10" rx="5" fill="#7dd3c0" opacity="0.9"/>
  <rect x="416" y="901" width="192" height="4" rx="2" fill="#7dd3c0" opacity="0.25"/>

  <!-- the entangled pair -->
  <path d="M282.7 369.3L273.2 347.4M339.5 662.6L357.4 695.6M415.9 640.1L446.7 651.4M231.0 620.2L221.4 649.1M382.5 646.4L398.7 656.0M182.7 466.3L179.5 440.2M186.6 461.7L167.6 423.2M218.7 401.6L171.4 398.7M397.1 643.6L432.8 650.1M196.1 578.4L152.7 584.7M274.3 375.6L246.7 364.5M434.8 628.4L462.4 630.3M230.6 403.2L230.6 388.0M242.1 382.2L235.8 369.7M237.5 386.1L232.0 338.9M199.4 424.1L165.7 397.4" stroke="#ffb454" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none"/>
  <path d="M825.9 584.5L854.2 596.5M620.5 377.9L597.0 374.4M669.8 658.3L661.2 680.0M799.5 620.8L823.7 638.4M780.5 383.5L790.3 347.0M589.5 410.0L590.7 392.5M839.3 491.5L855.5 503.1M607.5 635.6L573.4 646.3M790.7 633.9L820.3 658.6M835.4 534.8L873.5 540.7M679.8 369.3L649.2 342.5M840.7 557.9L858.3 580.4M647.0 655.4L621.0 668.5M771.0 633.6L781.3 664.1M798.3 616.9L794.5 650.0M785.6 390.6L819.5 388.5" stroke="#5ec8ff" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none"/>
  <circle cx="330" cy="512" r="128" fill="url(#orbL)"/>
  <circle cx="694" cy="512" r="128" fill="url(#orbR)"/>
</svg>
